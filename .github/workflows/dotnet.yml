name: .NET CI
on: [push]

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v1.1
      
    - name: Restore Packages
      run: nuget restore web4.sln
      
    - name: Build
      run: msbuild web4.sln /p:Configuration=Release

